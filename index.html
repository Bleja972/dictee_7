function plain(s){return s.replace(/[{}]/g,'')}

ougies'].includes(word.toLowerCase())){let group=document.createElement('span');group.className='word-picture picture-pair';pic.className='mini-picture';let twin=pic.cloneNode(true);group.setAttribute('aria-hidden','true');group.append(pic,twin);box.append(group)}else box.append(pic)}if(word.toLowerCase()==='a'){let label=document.createElement('strong');label.className='verb-label';label.setAttribute('aria-label','Verbe conjugué');label.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" preserveAspectRatio="none" aria-hidden="true"><text x="0" y="29" textLength="160" lengthAdjust="spacingAndGlyphs" fill="#d31521" font-family="Arial,sans-serif" font-weight="900" font-size="32">VERBE</text><path d="M80 38V58M73 51L80 59L87 51" fill="none" stroke="#d31521" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';box.classList.add('verb-gap');box.append(label)}box.append(btn,input);$('sentence').append(box)}else part.split(/(range|prends|dessine)/).forEach(piece=>{if(/^(range|prends|dessine)$/.test(piece)){let verb=document.createElement('span');verb.className='printed-verb';let label=document.createElement('strong');label.className='printed-verb-label';label.setAttribute('aria-label','Verbe conjugué');label.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" preserveAspectRatio="none" aria-hidden="true"><text x="0" y="29" textLength="160" lengthAdjust="spacingAndGlyphs" fill="#d31521" font-family="Arial,sans-serif" font-weight="900" font-size="32">VERBE</text><path d="M80 38V58M73 51L80 59L87 51" fill="none" stroke="#d31521" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';verb.append(label,document.createTextNode(piece));$('sentence').append(verb)}else $('sentence').append(document.createTextNode(piece))})});$('label').textContent='Phrase '+(p+1)+' sur '+DATA[d].length;$('progress').max=DATA[d].length;$('progress').value=p;$('count').textContent=scoreText();$('next').textContent=p===DATA[d].length-1?'Terminer ★':'Phrase suivante →'}
function scoreText(){return firstScore+' / 15 mots au premier essai · '+(firstScore/15*100).toLocaleString('fr-FR',{maximumFractionDigits:1})+' %'}function isCorrect(i){let ok=normalize(i.value)===normalize(i.dataset.answer);if(i.dataset.sentenceStart==='true'){let first=i.value.trim().normalize('NFC').charAt(0);ok=ok&&first!==''&&first===first.toLocaleUpperCase('fr')}return ok}
function check(){let inputs=[...document.querySelectorAll('.gap input')],correct=0;inputs.forEach(i=>{let ok=isCorrect(i);i.parentElement.classList.toggle('good',ok);i.parentElement.classList.toggle('bad',!ok);i.setAttribute('aria-invalid',String(!ok));if(ok)correct++});if(!marked){firstScore+=correct;marked=true} $('feedback').textContent=correct===inputs.length?'Bravo ! Tous les mots sont bien écrits.':'Tu as réussi '+correct+' mot(s) sur '+inputs.length+'. Écoute encore et réessaie.';$('count').textContent=scoreText();$('next').disabled=correct!==inputs.length;if(correct<inputs.length){let missingCapital=inputs.some(i=>i.dataset.sentenceStart==='true'&&normalize(i.value)===normalize(i.dataset.answer)&&!isCorrect(i));if(missingCapital)$('feedback').textContent='N’oublie pas la majuscule au début de la phrase !';inputs.find(i=>!isCorrect(i)).focus()}}
$('clear').onclick=()=>{document.querySelectorAll('.gap input').forEach(i=>{i.value='';i.parentElement.classList.remove('bad','good');i.removeAttribute('aria-invalid')});$('feedback').textContent='';$('solution').textContent='';$('next').disabled=true;focused=document.querySelector('.gap input');if(focused)focused.focus()};$('check').onclick=check;$('listen').onclick=()=>speak(plain(DATA[d][p]));$('help').onclick=()=>{marked=true;$('solution').textContent=plain(DATA[d][p]);$('feedback').textContent='Observe la correction, puis recopie les mots dans les cases.'};$('next').onclick=()=>{if(p<DATA[d].length-1){p++;render()}else{$('progress').value=DATA[d].length;let total=DATA[d].reduce((sum,line)=>sum+(line.match(/{[^}]+}/g)||[]).length,0),percent=(firstScore/total*100).toLocaleString('fr-FR',{maximumFractionDigits:1});$('result').hidden=false;$('result').textContent='★ '+percent+' % de mots réussis au premier essai — '+firstScore+' sur '+total+'.';$('feedback').textContent='Dictée terminée ! Tu peux recommencer pour t’entraîner.';$('check').disabled=true;$('help').disabled=true;$('next').disabled=true}};function reset(){if(window.speechSynthesis)speechSynthesis.cancel();d=Number($('dict').value);p=0;firstScore=0;render()}$('dict').onchange=reset;$('restart').onclick=reset;document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{if(!focused)return;let a=focused.selectionStart,z=focused.selectionEnd;focused.setRangeText(b.dataset.char,a,z,'end');focused.dispatchEvent(new Event('input'));focused.focus()});render();
function showMenu(){if(window.speechSynthesis)speechSynthesis.cancel();$('menuPanel').hidden=false;$('menuButton').setAttribute('aria-expanded','true');$('menuPanel').scrollIntoView({block:'start'});$('menuGrid').querySelector('button').focus()}
$('menuButton').setAttribute('aria-controls','menuPanel');$('menuButton').setAttribute('aria-expanded','false');$('menuButton').onclick=showMenu;
function hideMenu(){$('menuPanel').hidden=true;$('menuButton').setAttribute('aria-expanded','false');$('menuButton').focus()}
$('closeMenu').onclick=hideMenu;
DATA.forEach((_,i)=>{let b=document.createElement('button');b.textContent='Dictée '+(i+1);b.onclick=()=>{$('dict').value=String(i);reset();hideMenu()};$('menuGrid').append(b)});
</script></html>
